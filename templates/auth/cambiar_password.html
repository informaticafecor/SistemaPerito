<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Sistema Perito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
        }
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    
    <div class="card rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-500 rounded-full mb-4">
                <i class="fas fa-key text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">CAMBIAR CONTRASEÑA</h1>
            {% if primer_inicio %}
            <p class="text-yellow-600 text-sm mt-2 font-semibold">
                <i class="fas fa-exclamation-triangle mr-1"></i>
                Debe cambiar su contraseña en el primer inicio
            </p>
            {% endif %}
        </div>
        
        <!-- Mensaje de error -->
        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span>{{ error }}</span>
            </div>
        </div>
        {% endif %}
        
        <!-- Formulario -->
        <form id="cambiarPasswordForm" method="POST" class="space-y-5">
            <!-- Contraseña actual (solo si NO es primer inicio) -->
            {% if not primer_inicio %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">CONTRASEÑA ACTUAL</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="password" 
                           name="password_actual" 
                           id="password_actual"
                           required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                           placeholder="Ingrese contraseña actual">
                </div>
            </div>
            {% endif %}
            
            <!-- Nueva contraseña -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">NUEVA CONTRASEÑA</label>
                <div class="relative">
                    <i class="fas fa-key absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="password" 
                           name="password_nueva" 
                           id="password_nueva"
                           required
                           minlength="6"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                           placeholder="Mínimo 6 caracteres">
                </div>
            </div>
            
            <!-- Confirmar contraseña -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">CONFIRMAR CONTRASEÑA</label>
                <div class="relative">
                    <i class="fas fa-check-circle absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="password" 
                           name="password_confirmar" 
                           id="password_confirmar"
                           required
                           minlength="6"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                           placeholder="Repita la nueva contraseña">
                </div>
            </div>
            
            <!-- Botones -->
            <div class="flex space-x-3">
                {% if not primer_inicio %}
                <a href="/" class="flex-1 bg-gray-500 text-white py-3 px-4 rounded-lg font-semibold hover:bg-gray-600 transition text-center">
                    Cancelar
                </a>
                {% endif %}
                <button type="submit" 
                        id="btnCambiar"
                        class="flex-1 bg-blue-900 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-800 transition">
                    <i class="fas fa-save mr-2"></i>Guardar
                </button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('cambiarPasswordForm').addEventListener('submit', function(e) {
            const nueva = document.getElementById('password_nueva').value;
            const confirmar = document.getElementById('password_confirmar').value;
            
            if (nueva !== confirmar) {
                e.preventDefault();
                alert('Las contraseñas no coinciden');
                return;
            }
            
            if (nueva.length < 6) {
                e.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres');
                return;
            }
        });
    </script>
</body>
</html>
